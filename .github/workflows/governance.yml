name: nightly-governance-snapshot

on:
  schedule:
    - cron: "0 16 * * *"   # 2am AEST
  workflow_dispatch:
    inputs:
      reset_tables:
        description: "Drop and recreate the governance tables (1 = yes)"
        default: "0"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "snowflake-connector-python[pandas]"
      - name: Crawl and score
        env:
          OMNI_BASE_URL: ${{ secrets.OMNI_BASE_URL }}
          OMNI_TOKEN: ${{ secrets.OMNI_TOKEN }}
          MODEL_FILTER: 0c056618-c536-438d-ba04-821cf5f37ad6   # governance demo model
        run: |
          python scripts/crawl.py
          python scripts/similarity.py
      - name: Load warehouse (Snowflake)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          RESET_TABLES: ${{ inputs.reset_tables || '0' }}
        run: |
          python scripts/load_warehouse.py --target snowflake \
            --database ${{ secrets.SNOWFLAKE_DATABASE }} --schema CONTENT_GOVERNANCE
      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-snapshot
          path: out/
